#
# tuned profile: legion-powersave
# Optimized for Lenovo Legion 5 Pro Gen 8 (R9 7945HX + RTX 4070)
# Maximum battery autonomy (integrated with CachyOS)
#
[main]
summary=Legion - maximum battery life profile integrated with CachyOS
include=cachyos-powersave

[cpu]
# Governor override for AMD Ryzen 9 7945HX
governor=schedutil
energy_performance_preference=power
boost=0
max_perf_pct=75

[sysctl]
# Disk and memory writeback optimizations
vm.laptop_mode=5
vm.dirty_writeback_centisecs=1500
vm.dirty_expire_centisecs=3000
kernel.nmi_watchdog=0
vm.swappiness=10

[vm]
# Suppress aggressive paging and premature flushes from base profiles
transparent_hugepages=madvise
dirty_bytes=20%
dirty_background_bytes=10%

[sysctl-zram]
type=sysctl
devices=zram*
vm.swappiness=10

[acpi]
platform_profile=low-power

[video]
panel_power_savings=3

[script]
script=${i:PROFILE_DIR}/script.sh
