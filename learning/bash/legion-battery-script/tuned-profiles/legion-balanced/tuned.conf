#
# tuned profile: legion-balanced
#
[main]
summary=Legion - balanceado en AC fusionado con CachyOS
include=cachyos-desktop

[cpu]
governor=schedutil
energy_performance_preference=balance_performance

[acpi]
platform_profile=balanced

[video]
panel_power_savings=0

[script]
script=${i:PROFILE_DIR}/script.sh
